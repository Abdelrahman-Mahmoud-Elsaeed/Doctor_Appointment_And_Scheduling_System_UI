<div class="min-h-screen bg-gradient-to-br from-[#00bfa6]/10 via-white to-[#007bff]/10 flex items-center justify-center p-4">
  
  <main class="max-w-2xl w-full text-center">
    
    <div class="mb-8" aria-hidden="true">
      <div class="text-9xl font-bold text-[#00bfa6]/20 mb-4 select-none">404</div>
      <div class="w-24 h-24 bg-[#00bfa6]/10 rounded-full flex items-center justify-center mx-auto mb-6">
        <lucide-icon [img]="Search" class="w-12 h-12 text-[#00bfa6]"></lucide-icon>
      </div>
    </div>

    <h1 id="error-title" tabindex="-1" class="text-gray-900 mb-4 text-4xl font-bold focus:outline-none">
      Page Not Found
    </h1>
    <p class="text-xl text-gray-600 mb-8 max-w-md mx-auto">
      Oops! The page you're looking for doesn't exist. It might have been moved or deleted.
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <app-button
        size="lg"
        variant="outline"
        (click)="goBack()"
        aria-label="Go back to previous page"
      >
        <lucide-icon aria-hidden="true" [img]="ArrowLeft" class="w-4 h-4 mr-2"></lucide-icon>
        Go Back
      </app-button>
      
      <app-button
        size="lg"
        customClasses="bg-[#00bfa6] hover:bg-[#00a890]"
        routerLink="/"
      >
        <lucide-icon aria-hidden="true" [img]="Home" class="w-4 h-4 mr-2"></lucide-icon>
        Back to Home
      </app-button>
    </div>

    <nav aria-label="Suggested pages" class="mt-12 pt-8 border-t">
      <p class="text-gray-600 mb-4 font-medium">Looking for something? Try these:</p>
      
      <ul class="flex flex-wrap gap-3 justify-center list-none p-0">
        <li>
          <app-button variant="ghost" routerLink="/find-doctor">
            Find a Doctor
          </app-button>
        </li>
        <li>
          <app-button variant="ghost" routerLink="/appointments">
            My Appointments
          </app-button>
        </li>
        <li>
          <app-button variant="ghost" routerLink="/profile">
            My Profile
          </app-button>
        </li>
      </ul>
    </nav>
  </main>
</div>
