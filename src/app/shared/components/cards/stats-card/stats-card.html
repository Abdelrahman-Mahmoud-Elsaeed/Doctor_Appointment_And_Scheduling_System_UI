<app-card class="p-6 transition hover:shadow-lg">
  <section class="flex items-start justify-between">
    <dl>
      <dt class="text-sm text-gray-600 mb-1">{{ label }}</dt>
      <dd aria-live="polite" class="text-3xl font-bold text-gray-900">{{ value }}</dd>
    </dl>

    <div [class]="'w-12 h-12 rounded-lg flex items-center justify-center ' + getBgColor(icon)">

      @switch (icon) {
        @case ('calendar') {
          <lucide-icon aria-hidden="true"  [img]="Calendar" class="bg-blue-100 text-blue-600 w-6 h-6"></lucide-icon>
        }
        @case ('clock') {
          <lucide-icon aria-hidden="true"  [img]="Clock" class="w-6 h-6 bg-green-100 text-green-600"></lucide-icon>
        }
        @case ('users') {
          <lucide-icon aria-hidden="true"  [img]="Users" class="w-6 h-6 bg-purple-100 text-purple-600"></lucide-icon>
        }
        @case ('trending-up') {
          <lucide-icon aria-hidden="true"  [img]="TrendingUp" class="w-6 h-6 bg-orange-100 text-orange-600"></lucide-icon>
        }
        @default {
          <lucide-icon aria-hidden="true"  [img]="Calendar" class="bg-blue-100 text-blue-600 w-6 h-6"></lucide-icon>
        }
      }
    </div>
  </section>
  </app-card>
